server:
  port: 5100

spring:
  application:
    name: syntheticData
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: hackDataPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      open-in-view: false
  ai:
    vertex:
      ai:
        gemini:
            project-id: "project-54de4b72-d89d-4842-902"
            location: "global"
            model: "gemini-3.1-flash-lite"
devtools:
  restart:
    exclude: "db/**,*.db,*.mv.db,target/**"
agent:
  mode: BOTH
logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.web.client.RestClient: INFO
management:
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_URL}