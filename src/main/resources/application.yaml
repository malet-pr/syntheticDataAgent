server:
  port: 5100

spring:
  application:
    name: syntheticData
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: hackDataPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  ai:
    google:
      genai:
        vertex-ai: true
        project-id: ${GCP_PROJECT_ID}
        location: us-central1
management:
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_URL}