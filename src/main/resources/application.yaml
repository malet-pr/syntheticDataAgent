server:
  port: ${PORT:8080}

spring:
  application:
    name: syntheticData
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: hackDataPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        open-in-view: false
  ai:
    vertex:
      ai:
        gemini:
            project-id: ${GOOGLE_CLOUD_PROJECT}
            location: "global"
            model: "gemini-3.6-flash"
    max_batch_size: 100
logging:
  level:
    org.springframework.ai: INFO
    org.springframework.web.client.RestClient: INFO
